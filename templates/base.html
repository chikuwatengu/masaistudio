<!DOCTYPE html>
<html lang="ja">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}MASAISTUDIO{% endblock title %}</title>
	<style>
	 /* サイト全体の共通ベーススタイル */
	 body {
	     max-width: 720px;
	     margin: 40px auto;
	     padding: 0 24px 80px;
	     color: #222;
	     line-height: 1.8;
	     font-family: sans-serif;
	 }
	 img {
	     max-width: 100%;
	     height: auto;
	 }

	 /* スマホ画面（600px以下）向けの共通微調整 */
	 @media (max-width: 600px) {
	     body {
		 margin: 16px auto;
		 padding: 0 16px 60px;
		 font-size: 15px;
	     }
	 }

	 /* 子テンプレート（rulebook.html など）専用の追加CSSが入る場所 */
	 {% block extra_css %}{% endblock extra_css %}
	</style>
    </head>
    <body>

	{% block content %}{% endblock content %}

    </body>
</html>
